<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sorting Algorithm Visualizer</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="favicon.png">
</head>

<body>
  <div class="toast" id="toast" role="alert">
    <i class="fas fa-triangle-exclamation" aria-hidden="true"></i>
    <span id="toast-message"></span>
  </div>

  <div class="container">
    <header class="app-header">
      <h1>Sorting Algorithm Visualizer</h1>
      <p class="subtitle" id="status" aria-live="polite">Select an algorithm to visualize.</p>
    </header>

    <!-- Settings controls -->
    <div class="controls settings-row">
      <div class="array-settings" aria-label="Array controls">
        <label class="control-group">
          <span data-tooltip="Number of elements (2–2,000)">Size</span>
          <input type="number" id="size-input" min="2" max="2000">
        </label>

        <label class="control-group">
          <span data-tooltip="Range the element values are drawn from. 1-n keeps every value distinct; wider ranges matter for counting/radix-style sorts">Range</span>
          <select id="range"></select>
        </label>

        <label class="control-group">
          <span data-tooltip="How many repeated values appear in the array">Duplicates</span>
          <select id="duplicates"></select>
        </label>

        <label class="control-group">
          <span data-tooltip="Initial ordering of the array — the shape the sort starts from">Distribution</span>
          <select id="distribution"></select>
        </label>

        <button class="ghost-button compact-button" id="regenerate" data-tooltip="Generate a new array with these settings (R)" aria-label="Generate a new array">
          <i class="fas fa-dice" aria-hidden="true"></i>
        </button>
      </div>

      <div class="utility-settings" aria-label="Playback and documentation controls">
        <button class="ghost-button" id="more-info"><i class="fas fa-circle-info" aria-hidden="true"></i> Algorithms &amp; Docs</button>
      </div>
    </div>

    <!-- Algorithm picker -->
    <div class="controls algo-toolbar" id="algo-buttons"></div>

    <!-- Visualization with overlay color key -->
    <div class="array-wrap">
      <div class="legend" aria-label="Color key">
        <span class="legend-item"><i class="swatch comparing"></i> Comparing</span>
        <span class="legend-item"><i class="swatch swapping"></i> Swapping</span>
        <span class="legend-item"><i class="swatch writing"></i> Writing</span>
        <span class="legend-item"><i class="swatch pivot"></i> Pivot</span>
        <span class="legend-item"><i class="swatch sorted"></i> Sorted</span>
      </div>
      <div id="array-container"></div>
    </div>

    <!-- Playback controls -->
    <div class="controls playback-controls">
      <div class="scrub-row">
        <span class="scrub-label" data-tooltip="Drag to jump anywhere in the recorded sort">Progress:</span>
        <input type="range" id="scrub" min="0" max="0" value="0" step="1" aria-label="Scrub through the recorded sort" disabled>
        <span class="progress" id="progress">0%</span>
      </div>

      <div class="playback-row">
        <label class="control-group slider-group playback-speed">
          <span data-tooltip="Playback rate — how many recorded steps are applied per second">Speed</span>
          <i class="fas fa-person-walking speed-icon" aria-hidden="true"></i>
          <input type="range" id="speed" min="0" max="100" value="55">
          <i class="fas fa-person-running speed-icon" aria-hidden="true"></i>
          <span class="ops-rate" id="ops-rate" aria-label="Effective playback rate"></span>
        </label>

        <div class="transport" aria-label="Playback controls">
          <button id="step-back-large" class="step-large" title="Step back 50 (Shift+←)" aria-label="Step back 50"><i class="fas fa-backward-fast" aria-hidden="true"></i></button>
          <button id="step-back" title="Step back (←)" aria-label="Step back"><i class="fas fa-backward-step" aria-hidden="true"></i></button>
          <button id="play-pause" class="primary" title="Play / pause (Space)" aria-label="Play / pause"><i class="fas fa-play" aria-hidden="true"></i></button>
          <button id="step-forward" title="Step forward (→)" aria-label="Step forward"><i class="fas fa-forward-step" aria-hidden="true"></i></button>
          <button id="step-forward-large" class="step-large" title="Step forward 50 (Shift+→)" aria-label="Step forward 50"><i class="fas fa-forward-fast" aria-hidden="true"></i></button>
        </div>

        <div id="stats-panel" class="inline-stats" aria-label="Statistics">
          <p class="stat-row compare"><span class="stat-label">Comparisons</span><span id="stat-comparisons">0</span></p>
          <p class="stat-row write"><span class="stat-label">Writes</span><span id="stat-writes">0</span></p>
          <p class="stat-row shuffle"><span class="stat-label">Shuffles</span><span id="stat-shuffles">0</span></p>
          <p class="stat-row"><span class="stat-label">Time</span><span><span id="stat-time">0.00</span>s</span></p>
        </div>
      </div>
    </div>
  </div>

  <!-- Algorithm docs modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-container" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <nav class="modal-sidebar" id="modal-sidebar"></nav>
      <div class="modal-content-wrap">
        <div class="modal-header">
          <h2 id="modal-title">Sorting Algorithms</h2>
          <button class="close-button" id="modal-close" title="Close" aria-label="Close">
            <i class="fas fa-xmark" aria-hidden="true"></i>
          </button>
        </div>
        <div class="modal-content" id="modal-content"></div>
        <button class="modal-scroll-top" id="modal-scroll-top" type="button" aria-label="Back to summary" title="Back to summary" hidden>
          <i class="fas fa-chevron-up" aria-hidden="true"></i>
        </button>
      </div>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>

</html>
