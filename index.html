<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sorting Algorithm Visualizer</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="favicon.png">
</head>

<body>
  <div class="container">
    <header class="app-header">
      <h1>Sorting Algorithm Visualizer</h1>
      <p class="subtitle">Watch and step through classic sorting algorithms.</p>
    </header>

    <!-- Setup controls -->
    <div class="controls setup-controls">
      <label class="control-group">
        <span>Size</span>
        <input type="number" id="size-input" min="3" max="300">
        <button class="ghost-button" id="size-update">Set</button>
      </label>

      <label class="control-group">
        <span>Distribution</span>
        <select id="distribution"></select>
      </label>

      <button class="ghost-button" id="new-array"><i class="fas fa-shuffle"></i> New Array</button>
      <button class="ghost-button" id="more-info"><i class="fas fa-circle-info"></i> Algorithms &amp; Docs</button>
    </div>

    <!-- Algorithm picker -->
    <div class="controls algo-toolbar" id="algo-buttons"></div>

    <!-- Playback controls -->
    <div class="controls playback-controls">
      <div class="transport">
        <button id="step-back" title="Step back"><i class="fas fa-backward-step"></i></button>
        <button id="play-pause" class="primary" title="Play / pause"><i class="fas fa-play"></i></button>
        <button id="step-forward" title="Step forward"><i class="fas fa-forward-step"></i></button>
      </div>

      <label class="control-group slider-group">
        <span>Speed</span>
        <input type="range" id="speed" min="0" max="100" value="55">
      </label>

      <label class="control-group slider-group scrub-group">
        <span>Timeline</span>
        <input type="range" id="scrub" min="0" max="0" value="0">
      </label>

      <span class="status" id="status">Pick an algorithm</span>
    </div>

    <!-- Color legend -->
    <div class="legend">
      <span class="legend-item"><i class="swatch comparing"></i> Comparing</span>
      <span class="legend-item"><i class="swatch swapping"></i> Swapping / writing</span>
      <span class="legend-item"><i class="swatch pivot"></i> Pivot</span>
      <span class="legend-item"><i class="swatch sorted"></i> Sorted</span>
    </div>

    <div class="main-content">
      <div id="array-container"></div>

      <aside id="stats-panel">
        <h3>Statistics</h3>
        <p class="stat-row compare"><span class="stat-label">Comparisons</span><span id="stat-comparisons">0</span></p>
        <p class="stat-row write"><span class="stat-label">Array Writes</span><span id="stat-writes">0</span></p>
        <p class="stat-row shuffle"><span class="stat-label">Shuffles</span><span id="stat-shuffles">0</span></p>
        <p class="stat-row"><span class="stat-label">Time</span><span><span id="stat-time">0.00</span>s</span></p>
      </aside>
    </div>
  </div>

  <!-- Algorithm docs modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-container">
      <nav class="modal-sidebar" id="modal-sidebar"></nav>
      <div class="modal-content-wrap">
        <div class="modal-header">
          <h2>Sorting Algorithms</h2>
          <button class="close-button" id="modal-close" title="Close">&times;</button>
        </div>
        <div class="modal-content" id="modal-content"></div>
      </div>
    </div>
  </div>

  <script type="module" src="src/main.js"></script>
</body>

</html>
